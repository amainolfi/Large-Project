name: macrovanta
description: "MacroVanta — calorie & macro tracker (iOS/Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0                    # HTTP client with interceptors
  provider: ^6.1.2              # state management
  flutter_secure_storage: ^9.2.2 # JWT stored in Keychain / Keystore
  intl: ^0.19.0                 # date formatting (YYYY-MM-DD, display dates)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
