        carbs:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        fat:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        saturatedFat:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        transFat:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        fiber:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        sugar:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        sodium:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        potassium:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        calcium:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        iron:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        vitaminC:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        vitaminD:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        source:
          type: string
          enum: [manual, usda]
        date:
          $ref: "#/components/schemas/DateString"

    QuickAddFoodRequest:
      type: object
      required: [date]
      properties:
        date:
          $ref: "#/components/schemas/DateString"
        mealType:
          $ref: "#/components/schemas/MealType"

    FoodEntryResponse:
