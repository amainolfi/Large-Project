components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by `POST /api/auth/login`

  parameters:
    DateQuery:
      name: date
      in: query
      required: false
      description: Filter by date, in YYYY-MM-DD format. Summary endpoints default to the current UTC date.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      example: "2026-07-07"
    FoodEntryId:
      name: id
      in: path
      required: true
      description: Food entry id, stored as a MongoDB ObjectId
      schema:
        type: string
      example: 665f1c2ab8e4a91d2c3f0a11
    WellnessEntryId:
      name: id
      in: path
      required: true
      description: User-owned wellness entry id, stored as a MongoDB ObjectId
      schema:
        type: string
      example: 665f1c2ab8e4a91d2c3f0a21

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidDate:
              value:
                message: date must use YYYY-MM-DD format.
            validation:
              value:
                message: At least one field is required.
            weakPassword:
              value:
                message: Password must be at least 8 characters and include uppercase, lowercase, number, and special character.
    Unauthorized:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                message: Authentication token required.
            invalid:
              value:
                message: Invalid authentication token.
            expired:
              value:
                message: Invalid or expired authentication token.
    FoodNotFound:
      description: Food entry not found or not owned by this user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Food entry not found.
    WellnessNotFound:
      description: Wellness entry not found or not owned by this user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: Wellness entry not found.

  schemas:
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: Anthony
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Mainolfi
        email:
          type: string
          format: email
          maxLength: 254
          example: anthony@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Must include uppercase, lowercase, a number, and a special character
          example: Str0ng!Pass

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: anthony@example.com
        password:
          type: string
          format: password
          minLength: 1
          example: Str0ng!Pass

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: anthony@example.com

    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Must include uppercase, lowercase, a number, and a special character
          example: N3w!Passw0rd

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Must include uppercase, lowercase, a number, and a special character
          example: N3w!Passw0rd

    ProfileUpdateRequest:
      type: object
      description: At least one of `firstName` or `lastName` is required.
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50

    MealType:
      type: string
      enum: [Breakfast, Lunch, Dinner, Snack]
      example: Lunch

    DateString:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: "2026-07-07"

    NonNegativeNumberInput:
      description: Backend coerces numeric strings to numbers; sending JSON numbers is recommended.
      oneOf:
        - type: number
          minimum: 0
        - type: string
          pattern: '^\d+(\.\d+)?$'
      example: 2400

    User:
      type: object
      required: [id, firstName, lastName, email, isEmailVerified, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: 665f1c2ab8e4a91d2c3f0a10
        firstName:
          type: string
          example: Anthony
        lastName:
          type: string
          example: Mainolfi
        email:
          type: string
          format: email
          example: anthony@example.com
        isEmailVerified:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FoodEntry:
      type: object
      required: [id, foodName, servingSize, mealType, calories, protein, carbs, fat, saturatedFat, transFat, fiber, sugar, sodium, potassium, calcium, iron, vitaminC, vitaminD, source, confidence, date, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: 665f1c2ab8e4a91d2c3f0a11
        foodName:
          type: string
          example: Grilled Chicken Breast
        servingSize:
          type: string
          example: 6 oz
        mealType:
          $ref: "#/components/schemas/MealType"
        calories:
          type: number
          example: 280
        protein:
          type: number
          example: 52
        carbs:
          type: number
          example: 0
        fat:
          type: number
          example: 6
        saturatedFat:
          type: number
          example: 1.5
        transFat:
          type: number
          example: 0
        fiber:
          type: number
          example: 0
        sugar:
          type: number
          example: 0
        sodium:
          type: number
          example: 130
        potassium:
          type: number
          example: 450
        calcium:
          type: number
          example: 20
        iron:
          type: number
          example: 1
        vitaminC:
          type: number
          example: 0
        vitaminD:
          type: number
          example: 0
        source:
          type: string
          enum: [manual, ai, usda]
          example: manual
        confidence:
          type: string
          enum: [low, medium, high]
          nullable: true
          example: null
        date:
          $ref: "#/components/schemas/DateString"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FoodEntryInput:
      type: object
      required: [foodName, servingSize, mealType, calories, protein, carbs, saturatedFat, transFat, sodium, date]
      properties:
        foodName:
          type: string
          minLength: 1
          maxLength: 120
          example: Grilled Chicken Breast
        servingSize:
          type: string
          minLength: 1
          maxLength: 80
          example: 6 oz
        mealType:
          $ref: "#/components/schemas/MealType"
        calories:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        protein:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Grams
        carbs:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Grams
        fat:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Grams; defaults to zero when omitted
        saturatedFat:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Grams
        transFat:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Grams
        fiber:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Grams; defaults to zero when omitted
        sugar:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Total sugars in grams; defaults to zero when omitted
        sodium:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Milligrams
        potassium:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Milligrams; defaults to zero when omitted
        calcium:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Milligrams; defaults to zero when omitted
        iron:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Milligrams; defaults to zero when omitted
        vitaminC:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Milligrams; defaults to zero when omitted
        vitaminD:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumberInput"
            - description: Micrograms; defaults to zero when omitted
        source:
          type: string
          enum: [manual, usda]
          default: manual
        date:
          $ref: "#/components/schemas/DateString"

    FoodEntryUpdate:
      type: object
      description: Any subset of food entry fields. At least one field is required.
      minProperties: 1
      properties:
        foodName:
          type: string
          minLength: 1
          maxLength: 120
        servingSize:
          type: string
          minLength: 1
          maxLength: 80
        mealType:
          $ref: "#/components/schemas/MealType"
        calories:
          $ref: "#/components/schemas/NonNegativeNumberInput"
        protein:
