          type: array
          items:
            $ref: "#/components/schemas/FoodEntry"

    AiFoodLogRequest:
      type: object
      additionalProperties: false
      required: [text, date]
      properties:
        text:
          type: string
          minLength: 2
          maxLength: 500
          example: I had one medium banana and a rice cake for lunch
