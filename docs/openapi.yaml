    MacroGoal:
      type: object
      required: [id, dailyCalories, dailyProtein, dailyCarbs, dailyFat, dailySaturatedFat, dailyTransFat, dailyFiber, dailySugar, dailySodium, dailyPotassium, dailyCalcium, dailyIron, dailyVitaminC, dailyVitaminD, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: 665f1c2ab8e4a91d2c3f0a12
        dailyCalories:
          type: number
          example: 2400
        dailyProtein:
          type: number
          example: 180
        dailyCarbs:
          type: number
          example: 250
        dailyFat:
          type: number
          example: 70
        dailySaturatedFat:
          type: number
          example: 20
        dailyTransFat:
          type: number
          example: 2
        dailyFiber:
          type: number
          example: 28
        dailySugar:
          type: number
          example: 50
        dailySodium:
          type: number
          example: 2300
        dailyPotassium:
          type: number
          example: 4700
        dailyCalcium:
          type: number
          example: 1300
        dailyIron:
          type: number
          example: 18
        dailyVitaminC:
          type: number
          example: 90
        dailyVitaminD:
          type: number
          example: 20
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MacroGoalNullable:
      nullable: true
      allOf:
        - $ref: "#/components/schemas/MacroGoal"
      description: Null when the user has not set goals yet

    MacroTotals:
      type: object
      required: [calories, protein, carbs, fat, saturatedFat, transFat, fiber, sugar, sodium, potassium, calcium, iron, vitaminC, vitaminD]
      properties:
        calories:
          type: number
          example: 1850
        protein:
          type: number
          example: 140
        carbs:
          type: number
          example: 180
        fat:
          type: number
          example: 62
        saturatedFat:
          type: number
          example: 16
        transFat:
          type: number
          example: 1
        fiber:
          type: number
          example: 24
        sugar:
          type: number
          example: 42
        sodium:
          type: number
          example: 1900
        potassium:
          type: number
          example: 3500
        calcium:
          type: number
          example: 900
        iron:
          type: number
          example: 14
        vitaminC:
          type: number
          example: 75
        vitaminD:
          type: number
          example: 12

    MealTotals:
      type: object
      required: [Breakfast, Lunch, Dinner, Snack]
      properties:
        Breakfast:
          $ref: "#/components/schemas/MacroTotals"
        Lunch:
          $ref: "#/components/schemas/MacroTotals"
        Dinner:
          $ref: "#/components/schemas/MacroTotals"
        Snack:
          $ref: "#/components/schemas/MacroTotals"

    DailyTotals:
      type: object
      required: [date, totals]
      properties:
        date:
          $ref: "#/components/schemas/DateString"
        totals:
          $ref: "#/components/schemas/MacroTotals"

    ActivityType:
      type: string
      enum: [walking, running, cycling, swimming, elliptical, rowing, sports, other]

    Intensity:
      type: string
      enum: [low, moderate, high]

    SleepQuality:
      type: string
      enum: [poor, fair, good, excellent]

    CardioEntryInput:
      type: object
      additionalProperties: false
      required: [activityType, durationMinutes, date]
      properties:
        activityType:
          $ref: "#/components/schemas/ActivityType"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 30
        distanceKm:
          type: number
          minimum: 0
          maximum: 1000
          default: 0
          example: 5
        caloriesBurned:
          type: number
          minimum: 0
          maximum: 10000
          default: 0
          example: 320
        intensity:
          allOf:
            - $ref: "#/components/schemas/Intensity"
          default: moderate
        notes:
          type: string
          maxLength: 500
          default: ""
        date:
          $ref: "#/components/schemas/DateString"

    CardioEntryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        activityType:
          $ref: "#/components/schemas/ActivityType"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        distanceKm:
          type: number
          minimum: 0
          maximum: 1000
        caloriesBurned:
          type: number
          minimum: 0
          maximum: 10000
        intensity:
          $ref: "#/components/schemas/Intensity"
        notes:
          type: string
          maxLength: 500
        date:
          $ref: "#/components/schemas/DateString"

    CardioEntry:
      type: object
      required:
        [id, activityType, durationMinutes, distanceKm, caloriesBurned, intensity, notes, date, createdAt, updatedAt]
      properties:
        id:
          type: string
        activityType:
          $ref: "#/components/schemas/ActivityType"
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        distanceKm:
          type: number
          minimum: 0
          maximum: 1000
        caloriesBurned:
          type: number
          minimum: 0
          maximum: 10000
        intensity:
          $ref: "#/components/schemas/Intensity"
        notes:
          type: string
          maxLength: 500
        date:
          $ref: "#/components/schemas/DateString"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CardioEntryResponse:
      type: object
      required: [cardioEntry]
      properties:
        cardioEntry:
          $ref: "#/components/schemas/CardioEntry"

    CardioEntryListResponse:
      type: object
      required: [cardioEntries]
      properties:
        cardioEntries:
          type: array
          items:
            $ref: "#/components/schemas/CardioEntry"

    WaterEntryInput:
      type: object
      additionalProperties: false
      required: [amountMl, date]
      properties:
        amountMl:
          type: integer
          minimum: 1
          maximum: 5000
