        nightlySleepMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          example: 480
        dailyCardioMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          example: 30

    WellnessGoal:
      type: object
      required: [id, dailyWaterMl, nightlySleepMinutes, dailyCardioMinutes, createdAt, updatedAt]
      properties:
        id:
          type: string
          nullable: true
        dailyWaterMl:
          type: integer
          minimum: 0
          maximum: 20000
        nightlySleepMinutes:
          type: integer
          minimum: 0
