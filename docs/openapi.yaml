        date:
          $ref: "#/components/schemas/DateString"

    SleepEntryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        quality:
          $ref: "#/components/schemas/SleepQuality"
        notes:
          type: string
          maxLength: 500
        date:
          $ref: "#/components/schemas/DateString"

    SleepEntry:
      type: object
      required: [id, durationMinutes, quality, notes, date, createdAt, updatedAt]
      properties:
        id:
          type: string
